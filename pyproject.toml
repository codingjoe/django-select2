[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "django-select2"
readme = "README.md"
keywords = [ "autocomplete", "Django", "select2", "typeahead" ]
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 6 - Mature",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [ "django>=5.2.13", "django-appconf>=1.2" ]
[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"
[project.urls]
Changelog = "https://github.com/codingjoe/django-select2/releases"
Documentation = "https://django-select2.rtfd.io/"
Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/codingjoe/django-select2"
Issues = "https://github.com/codingjoe/django-select2/issues"
Releasenotes = "https://github.com/codingjoe/django-select2/releases/latest"
Source = "https://github.com/codingjoe/django-select2"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-django",
  "selenium",
]
docs = [
  "furo",
  "sphinx",
]

[tool.setuptools_scm]
write_to = "django_select2/_version.py"

[tool.flit]
[tool.flit.module]
name = "django_select2"

[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."tests/**" = [ "DJ006", "DJ007", "DJ008", "PLR2004", "S101", "S105", "S106", "S311", "S603", "S607" ]

[tool.isort]
atomic = true
line_length = 88
multi_line_output = 3
use_parentheses = true
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
default_section = "THIRDPARTY"
known_first_party = "django_select2, tests"

[tool.pytest]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests" ]
addopts = "--cov --cov-report=xml --cov-report=term --tb=short -rxs"
filterwarnings = [ "ignore::PendingDeprecationWarning", "error::RuntimeWarning" ]
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
[tool.coverage.run]
source = [ "django_select2" ]
[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.pydocstyle]
add_ignore = "D1"
